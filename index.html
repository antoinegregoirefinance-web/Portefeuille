  var KEY = 'mp_cle_' + D.salt.slice(0, 12);
  function bytes(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); }
  function b64(buf){ var s=''; new Uint8Array(buf).forEach(function(b){ s+=String.fromCharCode(b); }); return btoa(s); }
  function derive(pw){
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']).then(function(k){
      return crypto.subtle.deriveKey({name:'PBKDF2', salt:bytes(D.salt), iterations:D.it, hash:'SHA-256'}, k, {name:'AES-GCM', length:256}, true, ['decrypt']);
    });
  }
  function openWith(key){
    return crypto.subtle.decrypt({name:'AES-GCM', iv:bytes(D.iv)}, key, bytes(D.ct)).then(function(pt){
      var html = new TextDecoder().decode(pt);
      var go = function(){ document.open(); document.write(html); document.close(); };
      // attendre la fin du chargement : sinon l'app s'insère dans la page du mot de passe au lieu de la remplacer
      if (document.readyState === 'complete') go(); else window.addEventListener('load', go, { once: true });
    });
  }
  function err(t){ document.getElementById('e').textContent = t; }
  if (!window.crypto || !crypto.subtle) { err('Navigateur trop ancien ou page non sécurisée (https requis).'); return; }
  try {
    var saved = localStorage.getItem(KEY);
    if (saved) {
      crypto.subtle.importKey('raw', bytes(saved), {name:'AES-GCM'}, false, ['decrypt'])
        .then(openWith)
        .catch(function(){ try { localStorage.removeItem(KEY); } catch(e){} });
    }
  } catch (e) {}
  document.getElementById('f').addEventListener('submit', function(ev){
    ev.preventDefault(); err('Vérification…');
    var remember = document.getElementById('r').checked;
    derive(document.getElementById('p').value).then(function(key){
      return crypto.subtle.decrypt({name:'AES-GCM', iv:bytes(D.iv)}, key, bytes(D.ct)).then(function(){
        if (remember) return crypto.subtle.exportKey('raw', key).then(function(raw){ try { localStorage.setItem(KEY, b64(raw)); } catch(e){} return key; });
        return key;
      });
    }).then(openWith).catch(function(){ err('Mot de passe incorrect.'); });
